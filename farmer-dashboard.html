<!DOCTYPE html>
<html lang="hi">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farmer Dashboard</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>👨‍🌾 Farmer Dashboard</h1>

<h2 id="farmerName">Welcome</h2>

<hr>

<div class="card">
<h3>🥛 Total Milk</h3>
<h2 id="totalMilk">0 L</h2>
</div>

<div class="card">
<h3>💰 Total Amount</h3>
<h2 id="totalAmount">₹0</h2>
</div>
<div class="card">
    <h3>💵 Total Paid</h3>
    <h2 id="totalPaid">₹0</h2>
</div>

<div class="card">
    <h3>📌 Balance</h3>
    <h2 id="balance">₹0</h2>
</div>
<hr>

<h3>📋 Recent Milk Records</h3>

<table border="1" width="100%">

<thead>

<tr>
<th>Date</th>
<th>Session</th>
<th>Liter</th>
<th>Fat</th>
<th>Amount</th>
</tr>

</thead>

<tbody id="milkTable">

</tbody>

</table>

<br>

<button onclick="window.location.href='farmer-ledger.html'">
📒 View Ledger
</button>

<br><br>

<button onclick="logoutFarmer()">
🚪 Logout
</button>

</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/12.16.0/firebase-database-compat.js"></script>

<script src="firebase.js"></script>

<script src="farmer-dashboard.js"></script>

</body>
</html>
